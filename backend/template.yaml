AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sketch to Living App — Backend

Parameters:
  OpenAIApiKey:
    Type: String
    Description: OpenAI API Key
    NoEcho: true

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        S3_BUCKET: !Ref ImageBucket
        MODEL_ID: gpt-4o
        OPENAI_API_KEY: !Ref OpenAIApiKey
        DYNAMODB_TABLE: !Ref GenerationsTable

Resources:
  # ─── API Gateway ───
  SketchApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET, POST, DELETE, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # ─── Lambda: Generate (sync) ───
  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: lambda/
      Events:
        Generate:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/generate
            Method: post
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationsTable

  # ─── Lambda: Generate Stream ───
  GenerateStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler_stream
      CodeUri: lambda/
      Events:
        GenerateStream:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/generate-stream
            Method: post
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationsTable

  # ─── Lambda: Save Custom Style ───
  SaveStyleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: styles_handler.save_style
      CodeUri: lambda/
      Events:
        SaveStyle:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/styles
            Method: post
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket

  # ─── Lambda: List Custom Styles ───
  ListStylesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: styles_handler.list_styles
      CodeUri: lambda/
      Events:
        ListStyles:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/styles
            Method: get
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImageBucket

  # ─── Lambda: Delete Custom Style ───
  DeleteStyleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: styles_handler.delete_style
      CodeUri: lambda/
      Events:
        DeleteStyle:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/styles/{styleId}
            Method: delete
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket

  # ─── Lambda: Save Panel Settings ───
  SavePanelSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: settings_handler.save_panel_settings
      CodeUri: lambda/
      Events:
        SavePanelSettings:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/settings/panel
            Method: post
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket

  # ─── Lambda: Get Panel Settings ───
  GetPanelSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: settings_handler.get_panel_settings
      CodeUri: lambda/
      Events:
        GetPanelSettings:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/settings/panel
            Method: get
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImageBucket

  # ─── Lambda: Reset Panel Settings ───
  ResetPanelSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: settings_handler.reset_panel_settings
      CodeUri: lambda/
      Events:
        ResetPanelSettings:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/settings/panel/reset
            Method: post
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket

  # ─── Lambda: List Generations (History) ───
  ListGenerationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: generations_handler.list_generations
      CodeUri: lambda/
      Events:
        ListGenerations:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/generations
            Method: get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GenerationsTable

  # ─── Lambda: Get Generation by ID ───
  GetGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: generations_handler.get_generation
      CodeUri: lambda/
      Events:
        GetGeneration:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/generations/{genId}
            Method: get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GenerationsTable

  # ─── Lambda: Delete Generation ───
  DeleteGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: generations_handler.delete_generation
      CodeUri: lambda/
      Events:
        DeleteGeneration:
          Type: Api
          Properties:
            RestApiId: !Ref SketchApi
            Path: /api/generations/{genId}
            Method: delete
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationsTable

  # ─── S3 Bucket for sketch images ───
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sketch2app-images-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldSketches
            Status: Enabled
            ExpirationInDays: 7

  # ─── DynamoDB Table for generations ───
  GenerationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sketch2app-generations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gen_id
          AttributeType: S
      KeySchema:
        - AttributeName: gen_id
          KeyType: HASH

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${SketchApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  
  BucketName:
    Description: S3 bucket for sketch images
    Value: !Ref ImageBucket

<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00dcff"/>
      <stop offset="100%" stop-color="#7b3fff"/>
    </linearGradient>
    <clipPath id="hex-clip">
      <polygon points="50,14 79,31 79,65 50,82 21,65 21,31"/>
    </clipPath>
  </defs>

  <!-- Outer hexagon -->
  <polygon
    points="50,4 88,26 88,70 50,92 12,70 12,26"
    fill="none"
    stroke="url(#grad-hex)"
    stroke-width="2.5"
    opacity="0.95"
  />
  <!-- Inner hexagon -->
  <polygon
    points="50,14 79,31 79,65 50,82 21,65 21,31"
    fill="none"
    stroke="#ff6a00"
    stroke-width="1.2"
    opacity="0.5"
  />

  <!-- HUD ticks -->
  <line x1="50" y1="4"  x2="50" y2="0"  stroke="#00dcff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="88" y1="26" x2="92" y2="23" stroke="#00dcff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="88" y1="70" x2="92" y2="73" stroke="#ff6a00" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="12" y1="26" x2="8"  y2="23" stroke="#ff6a00" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="12" y1="70" x2="8"  y2="73" stroke="#00dcff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Dark fill -->
  <polygon points="50,4 88,26 88,70 50,92 12,70 12,26" fill="#0a0f1a" opacity="0.93"/>

  <!-- Icon content -->
  <g clip-path="url(#hex-clip)">
    <!-- Pencil body -->
    <rect x="25" y="31" width="10" height="26" rx="2" fill="none" stroke="#00dcff" stroke-width="1.8"/>
    <!-- Pencil tip -->
    <polygon points="25,57 35,57 30,68" fill="#00dcff" opacity="0.85"/>
    <!-- Pencil eraser -->
    <rect x="26" y="26" width="8" height="6" rx="1" fill="#7b3fff" opacity="0.9"/>
    <!-- Pencil shine -->
    <line x1="32" y1="34" x2="32" y2="54" stroke="#00dcff" stroke-width="0.6" opacity="0.28" stroke-linecap="round"/>

    <!-- Arrow -->
    <line x1="38" y1="48" x2="46" y2="48" stroke="#00dcff" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <polygon points="44,43 53,48 44,53" fill="#00dcff" opacity="0.95"/>

    <!-- App window -->
    <rect x="55" y="31" width="22" height="36" rx="3" fill="none" stroke="url(#grad-hex)" stroke-width="1.8"/>
    <rect x="55" y="31" width="22" height="7"  rx="3" fill="#7b3fff" opacity="0.55"/>
    <circle cx="60" cy="34.5" r="1.5" fill="#00dcff" opacity="0.9"/>
    <circle cx="65" cy="34.5" r="1.5" fill="#00dcff" opacity="0.5"/>
    <rect x="59" y="43" width="14" height="3" rx="1" fill="#00dcff" opacity="0.45"/>
    <rect x="59" y="49" width="10" height="3" rx="1" fill="#7b3fff" opacity="0.6"/>
    <rect x="59" y="55" width="12" height="2" rx="1" fill="#00dcff" opacity="0.22"/>
  </g>
</svg>

<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" rx="16" fill="#0d1f22"/>

  <!-- Outer crystal polygon -->
  <polygon points="80,18 108,40 122,72 114,108 80,126 46,108 38,72 52,40"
           fill="none" stroke="#00d4e8" stroke-width="2" opacity="0.9"/>

  <!-- Inner crystal -->
  <polygon points="80,38 100,54 106,78 96,100 80,108 64,100 54,78 60,54"
           fill="none" stroke="#00d4e8" stroke-width="1.2" opacity="0.45"/>

  <!-- Center dot -->
  <circle cx="80" cy="72" r="4" fill="#00d4e8" opacity="0.9"/>

  <!-- Facet lines from center to outer vertices -->
  <line x1="80" y1="72" x2="80"  y2="18"  stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="108" y2="40"  stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="122" y2="72"  stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="114" y2="108" stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="80"  y2="126" stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="46"  y2="108" stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="38"  y2="72"  stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="72" x2="52"  y2="40"  stroke="#00d4e8" stroke-width="0.8" opacity="0.25"/>

  <!-- Vertex dots outer -->
  <circle cx="80"  cy="18"  r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="108" cy="40"  r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="122" cy="72"  r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="114" cy="108" r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="80"  cy="126" r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="46"  cy="108" r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="38"  cy="72"  r="2.5" fill="#00d4e8" opacity="0.7"/>
  <circle cx="52"  cy="40"  r="2.5" fill="#00d4e8" opacity="0.7"/>
</svg>
